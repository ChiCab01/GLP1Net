##############################################################################
########################### GENERAL INFORMATION ##############################
##############################################################################

[metadata]

authors = "Chiara Cabrini, Andrea Trasatti"
data_creation = "2025-08-03"
description = "Effect og GLP-1 hormone in neurodegenerative diseases"
model_id = "GLP1_model"
model_name = "Modelling the effect of GLP-1 in a neuronal cell"


[paths]
MET_CSV_PATH = "METABOLITES.csv"
REACTIONS_CSV_PATH = "REACTIONS.csv"
REACTIONS_XLSX_PATH_prepare = "REACTIONS_prepare1.xlsx"
REACTIONS_XLSX_PATH_disease = "REACTIONS_disease2.xlsx"
METABOLITE_XLSX_PATH = "METABOLITES_clean.xlsx"
REACTIONS_XLSX_PATH = "REACTIONS_clean3.xlsx"


##############################################################################
################## CREATION OF THE CORRECT METABOLITES IDS ###################
##############################################################################

# Metabolites are sometimes written with greek letters.
# To standardize IDs, all greek letters will be converted to their spelled-out form.

[GREEK_LETTERS]
"α" = "alpha"
"β" = "beta"
"γ" = "gamma"
"δ" = "delta"
"ε" = "epsilon"
"ζ" = "zeta"
"η" = "eta"
"θ" = "theta"
"ι" = "iota"
"κ" = "kappa"
"λ" = "lambda"
"μ" = "mu"
"ν" = "nu"
"ξ" = "xi"
"ο" = "omicron"
"π" = "pi"
"ρ" = "rho"
"σ" = "sigma"
"τ" = "tau"
"υ" = "upsilon"
"φ" = "phi"
"χ" = "chi"
"ψ" = "psi"
"ω" = "omega"









##############################################################################
############## BOUNDS AND REACTIONS BASED ON REACTION TYPE ###################
##############################################################################

#######################################################
# lower and upper bound as generical defaults.

[defaults]
lower_bound = 0
upper_bound = 1000
bound_override = "auto"  # Options: "auto", "preserve", "force"


#######################################################
# lower and upper bound specific for each reaction type.

[DEFAULT_TYPE_BOUNDS] 
phosphorylation = { bounds = [0, 1000], reversible = false }
inhibition = { bounds = [0, 1000], reversible = false }




##############################################################################
#################### RULES TO WRITE THE REACTION STRING ######################
